/* Research is a reading surface, with quieter hierarchy than the start page. */
#internal.search-view{padding:32px max(42px,calc((100vw - 1100px)/2)) 70px;background:radial-gradient(ellipse at 100% 0,#50315b16,transparent 45%),#15121b;background-image:radial-gradient(ellipse at 100% 0,#50315b16,transparent 45%)!important}.search-view>.eyebrow{font-size:9px;letter-spacing:2px;color:#aa98bd}.search-view>h1{font-size:23px;font-weight:550;letter-spacing:-.6px;color:#eee8f5;margin:8px 0 4px}.search-view>h1+p{font-size:12px;color:#a79aad;margin:0 0 20px}.research-controls{max-width:840px;padding:8px;border:1px solid #c5aed02d;border-radius:17px;background:#25202d88;box-shadow:0 8px 30px #0002;gap:6px;flex-wrap:nowrap}.research-query{flex:1;min-width:100px;background:transparent!important;border:0!important;padding:9px 12px!important;font-size:15px;outline:none}.research-controls button{background:#c8aee510;border:1px solid transparent;border-radius:11px;padding:9px 15px;font-size:12px;color:#cdbbdc}.research-controls button:hover{background:#c8aee51e;border-color:#c8aee52b}.search-view>.research-meta{font-size:11px;margin:16px 0 2px;color:#b2a7bc}.search-view>.research-meta+p{font-size:10px;color:#83758f;max-width:800px;margin-top:4px;margin-bottom:26px}.search-view .result{position:relative;max-width:840px;padding:0 44px 0 0;margin:29px 0 34px;border:0;background:none;overflow:visible}.result-source{display:flex;align-items:center;gap:5px;font-size:11px;color:#bdafcb;margin-bottom:8px}.result-engine{color:#7f718b;font-size:10px}.result-title{display:inline;color:#d2baf6;font-size:20px;line-height:1.35;font-weight:500;letter-spacing:-.25px;text-decoration:none;overflow-wrap:anywhere}.result-title:hover{color:#e4d1ff;text-decoration:underline;text-underline-offset:4px}.result-title:visited{color:#bba5d4}.result-title:focus-visible{outline:2px solid #d5bcf5;outline-offset:5px;border-radius:3px}.search-view .result-snippet{color:#c4baca;font-size:13px;line-height:1.7;margin:9px 0 0;max-width:760px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-ori #tabs .browser-tab .tab-title{flex:1;min-width:0;max-width:none;text-align:left;border:0;border-radius:0;padding:4px 9px;background:transparent;box-shadow:none}
#tabs .browser-tab .tab-close{flex:0 0 24px;width:24px;min-width:24px;height:24px;margin-right:3px;padding:0;border:0;border-radius:6px;font-size:17px;line-height:1;background:transparent;color:#c8bdcf}
